<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Atividades</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1F3D">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap');

:root{
  --navy: #0F1F3D;
  --navy-2: #142647;
  --navy-3: #1B2F57;
  --gold: #C9A227;
  --gold-light: #E7CE7C;
  --gold-dim: rgba(201,162,39,0.35);
  --cream: #F4EFE3;
  --cream-dim: rgba(244,239,227,0.82);
  --line: rgba(201,162,39,0.16);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --shadow-card: 0 10px 30px rgba(0,0,0,0.35);
  --shadow-glow: 0 0 0 1px rgba(201,162,39,0.12), 0 8px 24px rgba(201,162,39,0.10);
}
*{ box-sizing: border-box; }
html,body{
  margin:0; padding:0;
  background-color:#0F1F3D;
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,39,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(201,162,39,0.08), transparent 55%);
  color:var(--cream); font-family:'Poppins', sans-serif; font-size:15px; min-height:100vh;
}

.app{
  max-width: 1000px;
  margin: 0 auto;
  padding: 32px 24px 80px;
  min-height: 100vh;
  display:flex;
  flex-direction:column;
}

.main-content{
  flex: 1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom: 48px;
  flex-wrap: wrap;
  gap: 16px;
}
.logo{ height: 34px; width: auto; display:block; }
.who{ display:flex; align-items:center; gap: 10px; font-size: 13px; color: var(--cream-dim); }
.who strong{ color: var(--gold-light); font-weight: 600; }
.topbar-actions{ display:flex; gap: 10px; align-items:center; flex-wrap: wrap; }
.link-btn{
  font-family:'Poppins', sans-serif;
  font-weight: 500;
  font-size: 13px;
  color: var(--gold-light);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-pill);
  padding: 9px 18px;
  cursor: pointer;
  background: var(--navy-2);
  text-decoration: none;
  transition: all .18s ease;
}
.link-btn:hover{ border-color: var(--gold); background: rgba(201,162,39,0.1); }

.masthead{ text-align:center; margin-bottom: 44px; }
.masthead h1{ font-family:'Poppins', sans-serif; font-weight:700; font-size: clamp(26px, 4.4vw, 38px); margin: 0 0 10px; }
.masthead p{ color: var(--cream-dim); font-size: 15px; margin: 0; }

.choice-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
}
.choice-card{
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 48px 32px;
  background: var(--navy-2);
  box-shadow: var(--shadow-card);
  transition: all .2s ease;
  cursor: pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  min-height: 260px;
}
.choice-card:hover{ border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 20px 44px rgba(0,0,0,0.45), var(--shadow-glow); }
.choice-card.locked{ cursor: default; opacity: 0.5; }
.choice-card.locked:hover{ transform:none; border-color: var(--line); box-shadow: var(--shadow-card); }
.choice-icon{
  width: 64px; height: 64px;
  border-radius: var(--radius-pill);
  background: rgba(201,162,39,0.14);
  color: var(--gold-light);
  display:flex; align-items:center; justify-content:center;
  font-size: 28px;
  margin-bottom: 22px;
}
.choice-card.locked .choice-icon{ background: rgba(244,239,227,0.08); color: var(--cream-dim); }
.choice-card h2{ font-family:'Poppins', sans-serif; font-weight: 700; font-size: clamp(20px, 2.6vw, 25px); margin: 0 0 12px; color: var(--cream); }
.choice-card p{ color: var(--cream-dim); font-size: 14.5px; line-height: 1.5; margin: 0; flex:1; }
.choice-badge{
  margin-top: 22px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--navy);
  background: var(--gold);
  border-radius: var(--radius-pill);
  padding: 7px 18px;
}
.choice-card.locked .choice-badge{ color: var(--cream-dim); background: rgba(244,239,227,0.08); }

.status{ text-align:center; color: var(--cream-dim); padding: 40px 0; }

@media (max-width: 760px){
  .choice-grid{ grid-template-columns: 1fr; }
  .choice-card{ padding: 36px 24px; min-height: unset; }
}

@media (max-width: 640px){
  .app{ padding: 24px 16px 60px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <img src="assets/logo.svg" alt="ÊNFASE" class="logo">
    <div class="topbar-actions">
      <div class="who">Olá, <strong id="whoName">...</strong></div>
      <a class="link-btn" id="adminLink" href="admin.html" style="display:none;">Painel da professora</a>
      <button class="link-btn" onclick="logout('index.html')">Sair</button>
    </div>
  </div>

  <div class="main-content">
    <div class="masthead">
      <h1>Para onde você quer ir?</h1>
      <p>Escolha uma área para continuar</p>
    </div>

    <div class="choice-grid" id="choiceGrid"></div>
    <div class="status" id="loadStatus">Carregando...</div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
let currentProfile = null;

function renderChoices(){
  const grid = document.getElementById('choiceGrid');
  const arquetipoDisponivel = currentProfile.role === 'admin' || !!currentProfile.arquetipo_habilitado;
  const cadernoDisponivel = currentProfile.role === 'admin' || !!currentProfile.caderno_habilitado;

  grid.innerHTML = `
    <div class="choice-card${arquetipoDisponivel ? '' : ' locked'}" id="cardArquetipo">
      <div class="choice-icon">◆</div>
      <h2>Arquétipo</h2>
      <p>Descubra a essência da sua marca</p>
      <div class="choice-badge">${arquetipoDisponivel ? 'Acessar' : 'Aguardando liberação'}</div>
    </div>
    <div class="choice-card${cadernoDisponivel ? '' : ' locked'}" id="cardMentoria">
      <div class="choice-icon">✦</div>
      <h2>Caderno Mentoria ÊNFASE</h2>
      <p>Suas aulas e atividades da mentoria</p>
      <div class="choice-badge">${cadernoDisponivel ? 'Acessar' : 'Aguardando liberação'}</div>
    </div>
  `;

  if(arquetipoDisponivel){
    document.getElementById('cardArquetipo').onclick = () => { window.location.href = 'aulas/arquetipo.html'; };
  }
  if(cadernoDisponivel){
    document.getElementById('cardMentoria').onclick = () => { window.location.href = 'dashboard.html'; };
  }

  document.getElementById('loadStatus').style.display = 'none';
}

(async function init(){
  const result = await requireApprovedSession('index.html');
  if(!result) return;
  currentProfile = result.profile;
  document.getElementById('whoName').textContent = currentProfile.nome || currentProfile.email;
  if(currentProfile.role === 'admin'){
    document.getElementById('adminLink').style.display = 'inline-block';
  }
  renderChoices();
})();
</script>

</body>
</html>
