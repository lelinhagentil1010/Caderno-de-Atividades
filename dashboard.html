<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal ÊNFASE — Aulas</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1F3D">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Parisienne&display=swap');

:root{
  --navy: #0F1F3D;
  --navy-2: #142647;
  --gold: #C9A227;
  --gold-light: #E7CE7C;
  --gold-dim: rgba(201,162,39,0.35);
  --cream: #F4EFE3;
  --cream-dim: rgba(244,239,227,0.82);
  --line: rgba(201,162,39,0.22);
}
*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; background:#0F1F3D; color:var(--cream); font-family:'EB Garamond', serif; font-size:17px; min-height:100vh; }

.app{
  max-width: 860px;
  margin: 0 auto;
  padding: 48px 24px 80px;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,39,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(201,162,39,0.08), transparent 55%);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom: 44px;
  flex-wrap: wrap;
  gap: 12px;
}
.topbar .who{ font-size: 14px; color: var(--cream-dim); }
.topbar .who strong{ color: var(--gold-light); }
.topbar-actions{ display:flex; gap: 10px; }
.link-btn{
  font-family:'EB Garamond', serif;
  font-size: 14px;
  color: var(--gold-light);
  border: 1px solid var(--gold-dim);
  border-radius: 20px;
  padding: 8px 16px;
  cursor: pointer;
  background: none;
  text-decoration: none;
}
.link-btn:hover{ border-color: var(--gold); background: rgba(201,162,39,0.08); }

.masthead{ text-align:center; margin-bottom: 48px; }
.eyebrow{ letter-spacing: 0.28em; text-transform: uppercase; font-size: 12px; color: var(--gold-light); margin-bottom: 14px; }
.masthead h1{ font-family:'Playfair Display', serif; font-weight:600; font-size: clamp(28px, 4.4vw, 40px); margin: 0 0 10px; }
.rule{ width: 64px; height:1px; background: var(--gold); margin: 22px auto 0; opacity: 0.6; }

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}
.card{
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 28px 24px;
  background: var(--navy-2);
  transition: all .18s ease;
  cursor: pointer;
  display:flex;
  flex-direction:column;
  min-height: 150px;
}
.card:hover{ border-color: var(--gold); transform: translateY(-2px); }
.card.locked{ cursor: default; opacity: 0.55; }
.card.locked:hover{ transform:none; border-color: var(--line); }
.card .num{
  font-family:'Playfair Display', serif;
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-light);
  margin-bottom: 10px;
}
.card h2{ font-family:'Playfair Display', serif; font-size: 21px; margin: 0 0 10px; color: var(--cream); }
.card p{ color: var(--cream-dim); font-size: 15px; line-height: 1.5; margin: 0; flex:1; }
.card .badge{
  margin-top: 14px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold-light);
}
.card.locked .badge{ color: var(--cream-dim); }

.status{ text-align:center; color: var(--cream-dim); padding: 40px 0; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="who">Olá, <strong id="whoName">...</strong></div>
    <div class="topbar-actions">
      <a class="link-btn" id="adminLink" href="admin.html" style="display:none;">Painel do professor</a>
      <button class="link-btn" onclick="logout('index.html')">Sair</button>
    </div>
  </div>

  <div class="masthead">
    <div class="eyebrow">ÊNFASE</div>
    <h1>Suas Aulas</h1>
    <div class="rule"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="status" id="loadStatus">Carregando...</div>
</div>

<script src="js/supabase-client.js"></script>
<script>
// Lista de aulas — adicionar uma entrada aqui quando uma aula nova for publicada
const AULAS = [
  { id: 'aula-1', numero: 1, titulo: 'Aula 1', descricao: 'Conteúdo em preparação.', ativo: false, url: null },
  { id: 'aula-2', numero: 2, titulo: 'Caderno de Gatilhos', descricao: 'Monte headlines combinando gatilhos mentais e templates.', ativo: true, url: 'aulas/aula-2.html' },
];

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  AULAS.forEach(a => {
    const card = document.createElement('div');
    card.className = 'card' + (a.ativo ? '' : ' locked');
    card.innerHTML = `
      <div class="num">Aula ${a.numero}</div>
      <h2>${a.titulo}</h2>
      <p>${a.descricao}</p>
      <div class="badge">${a.ativo ? 'Disponível' : 'Em breve'}</div>
    `;
    if(a.ativo){
      card.onclick = () => { window.location.href = a.url; };
    }
    grid.appendChild(card);
  });
  document.getElementById('loadStatus').style.display = 'none';
}

(async function init(){
  const result = await requireApprovedSession('index.html');
  if(!result) return;
  const { profile } = result;
  document.getElementById('whoName').textContent = profile.nome || profile.email;
  if(profile.role === 'admin'){
    document.getElementById('adminLink').style.display = 'inline-block';
  }
  renderGrid();
})();
</script>

</body>
</html>
