<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Atividades</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1F3D">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap');

:root{
  --navy: #0F1F3D;
  --navy-2: #142647;
  --gold: #C9A227;
  --gold-light: #E7CE7C;
  --gold-dim: rgba(201,162,39,0.35);
  --cream: #F4EFE3;
  --cream-dim: rgba(244,239,227,0.82);
  --line: rgba(201,162,39,0.16);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --shadow-card: 0 10px 30px rgba(0,0,0,0.35);
  --shadow-glow: 0 0 0 1px rgba(201,162,39,0.12), 0 8px 24px rgba(201,162,39,0.10);
}
*{ box-sizing: border-box; }
html,body{
  margin:0; padding:0;
  background-color:#0F1F3D;
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,39,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(201,162,39,0.08), transparent 55%);
  color:var(--cream); font-family:'Poppins', sans-serif; font-size:15px; min-height:100vh;
}

.app{
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 24px 80px;
  min-height: 100vh;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom: 40px;
  flex-wrap: wrap;
  gap: 16px;
}
.logo{ height: 34px; width: auto; display:block; }
.who{ display:flex; align-items:center; gap: 10px; font-size: 13px; color: var(--cream-dim); }
.who strong{ color: var(--gold-light); font-weight: 600; }
.topbar-actions{ display:flex; gap: 10px; align-items:center; flex-wrap: wrap; }
.link-btn{
  font-family:'Poppins', sans-serif;
  font-weight: 500;
  font-size: 13px;
  color: var(--gold-light);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-pill);
  padding: 9px 18px;
  cursor: pointer;
  background: var(--navy-2);
  text-decoration: none;
  transition: all .18s ease;
}
.link-btn:hover{ border-color: var(--gold); background: rgba(201,162,39,0.1); }

.masthead{ margin-bottom: 32px; }
.masthead h1{ font-family:'Poppins', sans-serif; font-weight:700; font-size: clamp(24px, 4vw, 32px); margin: 0; }

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}
.card{
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 26px 24px;
  background: var(--navy-2);
  box-shadow: var(--shadow-card);
  transition: all .2s ease;
  cursor: pointer;
  display:flex;
  flex-direction:column;
  min-height: 158px;
}
.card:hover{ border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,0.4), var(--shadow-glow); }
.card.locked{ cursor: default; opacity: 0.5; }
.card.locked:hover{ transform:none; border-color: var(--line); box-shadow: var(--shadow-card); }
.card .num{
  align-self: flex-start;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: rgba(201,162,39,0.14);
  color: var(--gold-light);
  display:flex; align-items:center; justify-content:center;
  font-family:'Poppins', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.card.locked .num{ background: rgba(244,239,227,0.08); color: var(--cream-dim); }
.card h2{ font-family:'Poppins', sans-serif; font-weight: 600; font-size: 18px; margin: 0 0 8px; color: var(--cream); }
.card p{ color: var(--cream-dim); font-size: 13.5px; line-height: 1.5; margin: 0; flex:1; }
.card .badge{
  align-self: flex-start;
  margin-top: 16px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--navy);
  background: var(--gold);
  border-radius: var(--radius-pill);
  padding: 5px 12px;
}
.card.locked .badge{ color: var(--cream-dim); background: rgba(244,239,227,0.08); }

.status{ text-align:center; color: var(--cream-dim); padding: 40px 0; }

.blocked{ text-align:center; padding: 60px 20px; }
.hidden{ display:none !important; }
.result-icon{ width: 56px; height: 56px; margin: 0 auto 18px; border-radius: var(--radius-pill); background: rgba(201,162,39,0.12); display:flex; align-items:center; justify-content:center; font-size: 26px; }
.result-title{ font-family:'Poppins', sans-serif; font-weight: 700; font-size: clamp(20px, 3.2vw, 26px); color: var(--cream); margin: 0 0 8px; text-align:center; }
.result-sub{ color: var(--cream-dim); font-size: 14.5px; line-height: 1.6; text-align:center; max-width: 460px; margin: 0 auto; }

/* Desktop grande (ex: 1920x1080) — aproveita mais a largura disponível */
@media (min-width: 1440px){
  .app{ max-width: 1200px; }
  .grid{ grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 24px; }
}

/* Tablet */
@media (max-width: 1024px){
  .app{ padding: 28px 20px 70px; }
}

/* Mobile */
@media (max-width: 640px){
  .app{ padding: 24px 16px 60px; }
  .topbar{ gap: 12px; }
  .grid{ gap: 16px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <img src="assets/logo.svg" alt="ÊNFASE" class="logo">
    <div class="topbar-actions">
      <div class="who">Olá, <strong id="whoName">...</strong></div>
      <a class="link-btn" href="inicio.html">◂ Voltar</a>
      <button class="link-btn" onclick="logout('index.html')">Sair</button>
    </div>
  </div>

  <div class="masthead">
    <h1>Caderno Mentoria ÊNFASE</h1>
  </div>

  <div class="grid" id="grid"></div>
  <div class="status" id="loadStatus">Carregando...</div>

  <!-- BLOQUEADO -->
  <div id="blockedScreen" class="hidden">
    <div class="blocked">
      <div class="result-icon">🔒</div>
      <div class="result-title">Ainda não disponível</div>
      <p class="result-sub">Essa área é liberada individualmente pela professora. Assim que ela liberar pra você, o acesso aparece aqui.</p>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
// Lista de aulas — adicionar uma entrada aqui quando uma aula nova for publicada
// soAdmin: true = só aparece disponível pra quem tem role 'admin'
// requerFlag: 'nome_da_coluna' = só aparece disponível se profiles[nome_da_coluna] === true (ou role admin) — liberação individual por aluno
const AULAS = [
  { id: 'avatar-especialista', numero: 'Diagnóstico', titulo: 'Avatar e Especialista', descricao: 'Pesquisa inicial sobre seu público e sua identidade como especialista.', ativo: true, url: 'aulas/avatar-especialista.html' },
  { id: 'aula-0', numero: 'Aula 0', titulo: 'Narrativa', descricao: 'Responda 6 perguntas e monte o texto da sua própria história.', ativo: true, url: 'aulas/aula-0.html' },
  { id: 'aula-1', numero: 'Aula 1', titulo: 'Identidade', descricao: 'Diagnóstico dos 5 eixos: quem você é e o que você comunica hoje.', ativo: true, url: 'aulas/aula-1.html' },
  { id: 'aula-2', numero: 'Aula 2', titulo: 'Anatomia Viral', descricao: 'Monte headlines combinando gatilhos mentais e templates.', ativo: true, url: 'aulas/aula-2.html' },
  { id: 'aula-3', numero: 'Aula 3', titulo: 'Gravação de Conteúdo', descricao: 'Desafio 100 Vídeos em 100 Dias: grave e publique aplicando a técnica de Anatomia Viral.', ativo: true, url: 'aulas/aula-3.html' },
  { id: 'aula-4', numero: 'Aula 4', titulo: 'Inteligência Artificial', descricao: 'Monte seu projeto de IA com o prompt oficial e gere roteiros completos do Método Anatomia Viral.', ativo: true, url: 'aulas/aula-4.html' },
];

let currentProfile = null;

function aulaDisponivel(a){
  if(!a.ativo) return false;
  if(!currentProfile) return false;
  if(currentProfile.role === 'admin') return true;
  if(a.soAdmin) return false;
  if(a.requerFlag && !currentProfile[a.requerFlag]) return false;
  return true;
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  AULAS.forEach(a => {
    const disponivel = aulaDisponivel(a);
    const card = document.createElement('div');
    card.className = 'card' + (disponivel ? '' : ' locked');
    card.innerHTML = `
      <div class="num">${a.numero}</div>
      <h2>${a.titulo}</h2>
      <p>${a.descricao}</p>
      <div class="badge">${disponivel ? 'Disponível' : 'Em breve'}</div>
    `;
    if(disponivel){
      card.onclick = () => { window.location.href = a.url; };
    }
    grid.appendChild(card);
  });
  document.getElementById('loadStatus').style.display = 'none';
}

(async function init(){
  const result = await requireApprovedSession('index.html');
  if(!result) return;
  const { profile } = result;
  currentProfile = profile;
  document.getElementById('whoName').textContent = profile.nome || profile.email;

  if(profile.role !== 'admin' && !profile.caderno_habilitado){
    document.getElementById('loadStatus').style.display = 'none';
    document.getElementById('blockedScreen').classList.remove('hidden');
    return;
  }

  renderGrid();
})();
</script>

</body>
</html>
