}

.link-btn:hover{ border-color: var(--gold); background: rgba(201,162,39,0.1); }

.masthead{ text-align:center; margin-bottom: 26px; }

.step-pill{

const TIPOS_TEXTO = ['Headline','Frase de abertura','Narrativa central','Assinatura','Legenda','Roteiro curto'];

// tipos de campo: text, textarea, longo, select, number, arq (arquétipo + porcentagem), cores, choice

const QUATRO = [
  ['Como eu falo:', 'essa frase tem a voz do meu principal?'],
  ['Como eu apareço:', 'a roupa, a cor e o cenário são os meus?'],
  ['Como eu ajo:', 'essa atitude prova o meu arquétipo?'],
  ['O que eu nunca faria:', 'isso é o meu arquétipo ou é a minha sombra?'],
];

// Instrução fixa do assistente (a mesma para todos os alunos)
const INSTRUCAO_IA = `Você é o assistente de voz do arquétipo do método de Lelinha Gentil. Você ajuda profissionais (nutricionistas, médicos, advogados, esteticistas, consultores, donos de empresa) a reescrever os próprios textos na voz do arquétipo de marca que eles receberam no Brandbook.

O QUE VOCÊ RECEBE
O arquétipo principal e o secundário do aluno, com as porcentagens; o tipo de texto (headline, frase de abertura, narrativa central, assinatura, legenda ou roteiro curto); sobre o que ele fala e para quem; palavras que ele quer manter; e o texto dele.

COMO REESCREVER
1. Mantenha o que o aluno quis dizer. Você muda a voz, não o conteúdo.
2. O arquétipo principal lidera: ele decide a promessa, o tom geral e como o texto termina. O secundário só tempera: aparece num detalhe, numa palavra, no jeito de entregar. Se os dois tiverem a mesma porcentagem, use o primeiro informado como principal.
3. Se o tipo de texto for headline: mantenha o gatilho de atenção que a headline já usa (disrupção, mistério, crença, reconhecimento, recompensa, popularidade ou autoridade) e mantenha a estrutura dela. Ajuste só as palavras e o tom para a voz do arquétipo. Nunca transforme uma headline em frase morna para ficar com a voz do arquétipo.
4. Se o tipo for assinatura: o profissional diz quem é e o que a pessoa encontra no perfil dele, em uma ou duas frases curtas.
5. Se o tipo for narrativa central: é a crença que o profissional repete em todo vídeo para reforçar o posicionamento. Uma ou duas frases.
6. Mantenha as palavras que o aluno pediu para manter.
7. Texto curto, falado, em português do Brasil, como a pessoa falaria olhando para a câmera.

REGRAS QUE NUNCA PODEM SER QUEBRADAS
- Nunca invente fatos, números, casos, histórias, títulos, prêmios ou resultados que o aluno não escreveu. Se faltar uma informação para a frase ficar boa, faça uma pergunta curta em vez de inventar.
- Nunca prometa resultado, cura, prazo ou garantia. Isso vale para todas as profissões e principalmente para médicos e profissionais de saúde. Prefira "pode", "começa", "caminho", "acompanhamento".
- Nunca use a sombra do arquétipo (lista abaixo).
- Nunca ataque colegas, concorrentes ou a própria profissão, mesmo no arquétipo Fora da Lei.
- Não use travessão. Não use anglicismos quando existir palavra em português. Não use a palavra "template": use "modelo".
- Não diga ao aluno que o arquétipo dele está errado nem sugira outro arquétipo. O arquétipo vem do Brandbook e não se discute.

COMO RESPONDER
Responda sempre neste formato:
1. O seu texto na voz do seu arquétipo: [texto reescrito]
2. O que mudou e por quê: [até três linhas, explicando a palavra, o tom ou o final que mudou e por que isso é do arquétipo dele]
3. Uma segunda opção: [outra versão, um pouco diferente]

REFERÊNCIA DOS 12 ARQUÉTIPOS

INOCENTE
Voz: simples e otimista. Como termina: termina com leveza e esperança.
Usa: simples, leve, dá para fazer, confie, bem-feito.
Evita: medo, ameaça, ninguém te conta, termo agressivo.
Sombra a evitar: Evita conflitos, nega problemas. No texto, ela aparece assim: Só mostra o lado bonito, nunca toma posição e foge da pergunta difícil.

EXPLORADOR
Voz: livre, mostra outro caminho. Como termina: termina abrindo um caminho novo.
Usa: descobri, caminho, outro jeito, fui ver de perto, liberdade.
Evita: sempre foi assim, o seguro é, não arrisque.
Sombra a evitar: A liberdade vira fuga, dificuldade de criar raízes. No texto, ela aparece assim: Muda de assunto e de formato toda semana. Ninguém sabe o que esperar dele.

SÁBIO
Voz: claro, explica o porquê. Como termina: termina com clareza: agora você sabe por quê.
Usa: entenda, por que, a pergunta certa é, em três etapas, o que a pesquisa mostra.
Evita: milagre, segredo, acho que, exagero sem base.
Sombra a evitar: Pensa demais e age de menos; usa o conhecimento para criar distância. No texto, ela aparece assim: Conteúdo longo, termo difícil, corrige o seguidor. Ou não posta porque ainda está estudando.

CARA COMUM
Voz: próximo, fala como gente. Como termina: termina com proximidade: a gente está junto.
Usa: a gente, igual você, no dia a dia, na real, eu também.
Evita: exclusivo, para poucos, termo técnico sem tradução.
Sombra a evitar: Apaga a própria individualidade para ser aceito. No texto, ela aparece assim: Copia o que todo mundo do nicho posta. A pessoa assiste e não lembra quem falou.

AMANTE
Voz: sensorial, cuida do detalhe. Como termina: termina com a sensação, o prazer, o cuidado.
Usa: sinta, detalhe, cuidado, experiência, beleza, especial.
Evita: barato, rápido e prático, tanto faz, qualquer um.
Sombra a evitar: Busca aprovação em excesso; depende do outro para se validar. No texto, ela aparece assim: Posta para agradar, mede o próprio valor pelas curtidas e muda de opinião conforme o comentário.

BOBO DA CORTE
Voz: leve, usa humor a serviço do tema. Como termina: termina com leveza, sem perder a mensagem.
Usa: imagina, olha isso, quem nunca, a vida é assim.
Evita: tom solene, discurso de ordem, sermão.

async function copiar(texto, btn){
  try{
    await navigator.clipboard.writeText(texto);
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); } catch(_){}
    ta.remove();
  }
  if(btn){
    if(!btn.dataset.orig) btn.dataset.orig = btn.textContent;
    btn.textContent = 'Copiado!';
    setTimeout(() => { btn.textContent = btn.dataset.orig; }, 1500);
  }
}

function elHtml(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}

function montarSelect(id, opcoes, vazio){
  const sel = document.createElement('select');
  sel.id = 'field_' + id;
  sel.innerHTML = `<option value="">${escapeHtml(vazio || 'Selecione...')}</option>` + opcoes.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
  sel.value = respostas[id] || '';
  sel.addEventListener('change', () => { respostas[id] = sel.value; agendarSalvar(); });
  return sel;
}
function montarInput(id, tipo, placeholder){
  const inp = document.createElement('input');
  inp.type = tipo; inp.id = 'field_' + id;
  if(placeholder) inp.placeholder = placeholder;
  if(tipo === 'number'){ inp.min = '0'; inp.max = '100'; inp.inputMode = 'numeric'; }
  inp.value = respostas[id] || '';
  inp.addEventListener('input', () => { respostas[id] = inp.value; agendarSalvar(); });
  return inp;
}
function montarTextarea(id, longo){
  const ta = document.createElement('textarea');
  ta.id = 'field_' + id;
  if(longo) ta.className = 'longo';
  ta.value = respostas[id] || '';
  ta.addEventListener('input', () => { respostas[id] = ta.value; agendarSalvar(); });
  return ta;
}

function montarCampo(c){
  const wrap = elHtml('div', 'field');
  wrap.appendChild(elHtml('label', null, escapeHtml(c.label)));
  if(c.ajuda) wrap.appendChild(elHtml('div', 'ajuda', escapeHtml(c.ajuda)));
  if(c.tipo === 'text') wrap.appendChild(montarInput(c.id, 'text'));
  else if(c.tipo === 'textarea') wrap.appendChild(montarTextarea(c.id, false));
  else if(c.tipo === 'arq'){
    const linha = elHtml('div', 'linha-arq');
    linha.appendChild(montarSelect(c.id, ARQUETIPOS, 'Selecione o arquétipo'));
    linha.appendChild(montarInput(c.pct, 'number', '% do Brandbook'));
    wrap.appendChild(linha);
  } else if(c.tipo === 'cores'){
    const linha = elHtml('div', 'linha-cores');
    c.ids.forEach((id, i) => linha.appendChild(montarInput(id, 'text', 'Cor ' + (i + 1))));
    wrap.appendChild(linha);
  } else if(c.tipo === 'choice'){
    const g = elHtml('div', 'choice-group');
    c.opcoes.forEach(op => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice-btn' + (respostas[c.id] === op ? ' selected' : '');
      b.textContent = op;
      b.addEventListener('click', () => {
        respostas[c.id] = respostas[c.id] === op ? '' : op;
        g.querySelectorAll('.choice-btn').forEach(x => x.classList.toggle('selected', x.textContent === respostas[c.id]));
        salvarAgora();
      });
      g.appendChild(b);
    });
    wrap.appendChild(g);
  }
  return wrap;
}

let telaAtual = 0;

function renderSteps(){
  const box = $('steps');
  box.innerHTML = '';
  TELAS.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'step-pill' + (i === telaAtual ? ' active' : '');
    b.textContent = t.nav;
    b.addEventListener('click', () => irPara(i));
    box.appendChild(b);
  });
}

function irPara(i){
  telaAtual = Math.max(0, Math.min(TELAS.length - 1, i));
  respostas._tela = telaAtual;
  agendarSalvar();
  renderTela();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderNav(card){
  const nav = elHtml('div', 'nav-acoes');
  const volta = document.createElement('button');
  volta.type = 'button'; volta.textContent = 'Voltar';
  volta.disabled = telaAtual === 0;
  volta.addEventListener('click', () => irPara(telaAtual - 1));
  nav.appendChild(volta);
  if(telaAtual < TELAS.length - 1){
    const prox = document.createElement('button');
    prox.type = 'button'; prox.className = 'primary'; prox.textContent = 'Avançar';
    prox.addEventListener('click', () => irPara(telaAtual + 1));
    nav.appendChild(prox);
  }
  card.appendChild(nav);
}

function renderTela(){
  renderSteps();
  const t = TELAS[telaAtual];
  const root = $('tela');
  root.innerHTML = '';
  const card = elHtml('div', 'card');

  if(t.assistente){ renderAssistente(card); }
  else {
    card.appendChild(elHtml('div', 'roteiro-sub', escapeHtml(t.titulo)));
    if(t.texto){
      card.appendChild(elHtml('div', 'card-intro', t.texto.map(p => `<p>${escapeHtml(p)}</p>`).join('')));
    }
    if(t.quatro){
      card.appendChild(elHtml('div', 'card-intro', '<p>Consulte estas quatro perguntas antes de postar.</p>'));
      const q = elHtml('div', 'quatro');
      QUATRO.forEach((x, i) => q.appendChild(elHtml('div', 'item', `${i + 1}. <strong>${escapeHtml(x[0])}</strong> ${escapeHtml(x[1])}`)));
      card.appendChild(q);
    }
    (t.campos || []).forEach(c => card.appendChild(montarCampo(c)));
    if(t.botoesAssistente){
      const ac = elHtml('div', 'acoes');
      const b1 = document.createElement('button');
      b1.type = 'button'; b1.textContent = 'Ajustar a frase com o assistente de voz';
      b1.addEventListener('click', () => abrirAssistente('Frase de abertura', respostas.ex1_frase));
      const b2 = document.createElement('button');
      b2.type = 'button'; b2.textContent = 'Ajustar a assinatura com o assistente de voz';
      b2.addEventListener('click', () => abrirAssistente('Assinatura', respostas.ex1_assin_nova));
      ac.appendChild(b1); ac.appendChild(b2);
      card.appendChild(ac);
    }
  }
  renderNav(card);
  root.appendChild(card);
}

  salvarAgora();
  irPara(TELAS.findIndex(t => t.assistente));

function pedidoAssistente(){
  const pct = (v) => (v !== undefined && String(v).trim() !== '') ? ` (${String(v).trim()}%)` : '';
  return [
    `Arquétipo principal: ${respostas.as_principal || ''}${pct(respostas.as_pct_principal)}`,
    `Arquétipo secundário: ${respostas.as_secundario || ''}${pct(respostas.as_pct_secundario)}`,
    `Tipo de texto: ${respostas.as_tipo || ''}`,
    `Sobre o que fala e para quem: ${respostas.as_sobre || ''}`,
    `Palavras que devem ser mantidas: ${(respostas.as_manter || '').trim() || 'nenhuma'}`,
    'Texto do aluno:',
    respostas.as_texto || '',
  ].join('\n');
}

let salvarTimer = null;
let salvarPendente = false;
let salvandoAgora = false;
let salvarDenovo = false;
let carregouOk = false;
let statusTimer = null;

function mostrarStatusSalvamento(texto, tipo){
  const el = $('saveStatus');
  clearTimeout(statusTimer);
  el.textContent = texto;
  el.className = 'save-status' + (tipo ? ' ' + tipo : '');
  if(tipo === 'ok') statusTimer = setTimeout(() => { el.textContent = ''; }, 2500);
}

function agendarSalvar(){
  if(!carregouOk) return;
  salvarPendente = true;
  mostrarStatusSalvamento('Salvando...');
  clearTimeout(salvarTimer);
  salvarTimer = setTimeout(salvarAgora, 700);
}

async function salvarAgora(){
  if(!carregouOk) return;
  clearTimeout(salvarTimer);
  salvarPendente = false;
  if(salvandoAgora){ salvarDenovo = true; return; }
  salvandoAgora = true;
  mostrarStatusSalvamento('Salvando...');
  let falhou = false;
  try{
    const { error } = await supabaseClient.from(TABELA).upsert({
      user_id: currentUserId,
      respostas: { ...respostas }
    }, { onConflict: 'user_id' });
    if(error) throw error;
  } catch(e){
    falhou = true;
    console.error('Não foi possível salvar', e);
  }
  salvandoAgora = false;
  if(salvarDenovo){
    salvarDenovo = false;
    await salvarAgora();
    return;
  }
  if(falhou) mostrarStatusSalvamento('Não foi possível salvar agora. Confira sua conexão, suas respostas continuam na tela.', 'erro');
  else mostrarStatusSalvamento('Salvo automaticamente', 'ok');
}

function salvarSePendente(){ if(salvarPendente) salvarAgora(); }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') salvarSePendente(); });
window.addEventListener('pagehide', salvarSePendente);

function blocosPdf(r){

  return [
    ['ARQUÉTIPOS (DO BRANDBOOK)', [
      ['Meu arquétipo principal:', arq('arq_principal', 'arq_pct_principal')],
      ['Meu arquétipo secundário:', arq('arq_secundario', 'arq_pct_secundario')],
    ]],
    ['EXERCÍCIO 1 · COMO O MEU ARQUÉTIPO FALA', [
      ['Tema do vídeo:', r.ex1_tema],
      ['A primeira frase depois da headline:', r.ex1_frase],
      ['A minha assinatura antes:', r.ex1_assin_antes],
      ['A minha assinatura nova:', r.ex1_assin_nova],
    ]],
    ['EXERCÍCIO 2 · COMO O MEU ARQUÉTIPO APARECE', [
      ['As três cores da minha paleta:', [r.ex2_cor1, r.ex2_cor2, r.ex2_cor3].filter(Boolean).join(', ')],
      ['A minha peça-assinatura:', r.ex2_peca],
      ['Uma peça ou cor que sai:', r.ex2_sai],
      ['O cenário onde eu gravo: o que fica:', r.ex2_cen_fica],
      ['O cenário onde eu gravo: o que sai:', r.ex2_cen_sai],
      ['A expressão na foto do perfil:', r.ex2_expressao],
      ['A minha foto de perfil atual conversa com isso?', r.ex2_foto],
      ['O que muda:', r.ex2_muda],
    ]],
    ['EXERCÍCIO 3 · QUEM LIDERA EM MIM', [
      ['O que o meu cliente sente comigo (o meu principal):', r.ex3_principal],
      ['Como eu entrego (o meu secundário):', r.ex3_secundario],
      ['Se o meu resultado é 50/50: qual sensação o meu cliente precisa sentir primeiro?', r.ex3_empate],
      ['Uma atitude real do meu trabalho que prova o meu principal:', r.ex3_atitude],
      ['Uma atitude que seria a minha sombra: o que eu nunca faria:', r.ex3_sombra],
    ]],
  ];
}

async function svgToPngDataUrl(url, width, height){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function gerarPdf(nomeAluno, emailAluno){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 18;
  const maxWidth = pageWidth - margin * 2;

  doc.setFillColor(15, 31, 61);
  doc.rect(0, 0, pageWidth, 36, 'F');
  try{
    const logo = await svgToPngDataUrl('../assets/logo.svg', 900, 260);
    const lw = 64, lh = lw * (260 / 900);
    doc.addImage(logo, 'PNG', (pageWidth - lw) / 2, (36 - lh) / 2, lw, lh);
  } catch(e){
    doc.setTextColor(255,255,255); doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    doc.text('ARQUÉTIPO NA PRÁTICA', pageWidth / 2, 22, { align: 'center' });
  }

  let y = 50;
  doc.setTextColor(15, 31, 61); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.text(`Aluno: ${nomeAluno || ''}`, margin, y); y += 7;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(60, 60, 60);
  if(emailAluno){ doc.text(`Email: ${emailAluno}`, margin, y); y += 6; }
  doc.text(`Arquétipo na prática · gerado em: ${new Date().toLocaleString('pt-BR')}`, margin, y);
  y += 12;

  const quebra = (alt) => { if(y > pageHeight - alt){ doc.addPage(); y = 22; } };
  function bloco(titulo, linhas){
    quebra(24);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(201, 162, 39);
    doc.splitTextToSize(titulo, maxWidth).forEach(l => { doc.text(l, margin, y); y += 6; });
    y += 2;
    linhas.forEach(([label, valor]) => {
      quebra(20);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(15, 31, 61);
      const ll = doc.splitTextToSize(label, maxWidth);
      doc.text(ll, margin, y); y += ll.length * 5.2 + 1;
      doc.setFont('helvetica', 'normal'); doc.setTextColor(40, 40, 40);
      String(valor || '(não preenchido)').split('\n').forEach(par => {
        doc.splitTextToSize(par || ' ', maxWidth).forEach(line => { quebra(14); doc.text(line, margin, y); y += 5.2; });
      });
      y += 5;
    });
    y += 3;
  }
  blocosPdf(respostas).forEach(([t, l]) => bloco(t, l));

  const nomeArquivo = (nomeAluno || 'aluno').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  doc.save(`arquetipo-na-pratica-${nomeArquivo || 'aluno'}.pdf`);
}

    carregouOk = true;
    if(!data) return;
    respostas = data.respostas || {};
    if(typeof respostas._tela === 'number') telaAtual = Math.max(0, Math.min(TELAS.length - 1, respostas._tela));
    if(data.comentario_professor){
      $('comentarioTexto').textContent = data.comentario_professor;
      $('comentarioBox').classList.remove('hidden');
    }
  } catch(e){
    console.error('Não foi possível carregar as respostas salvas', e);
    mostrarStatusSalvamento('Não foi possível carregar suas respostas salvas. Recarregue a página antes de continuar, pra não perder nada.', 'erro');
  }
}

(async function init(){
  const result = await requireApprovedSession('../index.html');
  if(!result) return;
  currentUserId = result.session.user.id;
  alunoNome = result.profile.nome || '';
  alunoEmail = result.profile.email || '';
  await carregarDados();
  renderTela();
})();
</script>
