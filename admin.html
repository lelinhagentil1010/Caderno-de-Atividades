<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Atividades, Painel da Professora</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1F3D">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap');

:root{
  --navy: #0F1F3D;
  --navy-2: #142647;
  --gold: #C9A227;
  --gold-light: #E7CE7C;
  --gold-dim: rgba(201,162,39,0.35);
  --cream: #F4EFE3;
  --cream-dim: rgba(244,239,227,0.82);
  --line: rgba(201,162,39,0.16);
  --red: #C24444;
  --green: #4A9D6E;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --shadow-card: 0 10px 30px rgba(0,0,0,0.35);
  --shadow-glow: 0 0 0 1px rgba(201,162,39,0.12), 0 8px 24px rgba(201,162,39,0.10);
}
*{ box-sizing: border-box; }
html,body{
  margin:0; padding:0;
  background-color:#0F1F3D;
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,39,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(201,162,39,0.08), transparent 55%);
  color:var(--cream); font-family:'Poppins', sans-serif; font-size:15px; min-height:100vh;
}

.app{ max-width: 920px; margin: 0 auto; padding: 40px 24px 80px; min-height: 100vh; }

.topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
.logo{ height: 32px; width: auto; display:block; }
.link-btn{
  font-family:'Poppins', sans-serif;
  font-weight: 500;
  font-size: 13px;
  color: var(--gold-light);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-pill);
  padding: 9px 18px;
  cursor: pointer;
  background: var(--navy-2);
  text-decoration: none;
  transition: all .18s ease;
}
.link-btn:hover{ border-color: var(--gold); background: rgba(201,162,39,0.1); }

.masthead{ margin-bottom: 32px; }
.masthead h1{ font-family:'Poppins', sans-serif; font-weight:700; font-size: clamp(24px, 4vw, 32px); margin: 0; }

.tabs{ display:flex; gap: 6px; margin-bottom: 28px; background: var(--navy-2); padding: 5px; border-radius: var(--radius-pill); border: 1px solid var(--line); flex-wrap: wrap; }
.tab{
  padding: 9px 18px;
  cursor:pointer;
  font-family:'Poppins', sans-serif;
  font-weight: 500;
  font-size: 13.5px;
  color: var(--cream-dim);
  border-radius: var(--radius-pill);
  transition: all .18s ease;
}
.tab.active{ color: var(--navy); background: var(--gold); font-weight: 600; }

.panel{ display:none; }
.panel.active{ display:block; }

.card{ border: 1px solid var(--line); border-radius: var(--radius-md); padding: 20px 22px; background: var(--navy-2); box-shadow: var(--shadow-card); margin-bottom: 14px; }
.card .row{ display:flex; justify-content:space-between; align-items:center; gap: 16px; flex-wrap: wrap; }
.card .nome{ font-family:'Poppins', sans-serif; font-weight: 600; font-size: 15.5px; color: var(--cream); }
.card .email{ font-size: 13px; color: var(--cream-dim); }
.card .when{ font-size: 11.5px; color: var(--cream-dim); margin-top: 4px; }
.actions{ display:flex; gap: 10px; }
button.small{
  font-family:'Poppins', sans-serif;
  font-weight: 500;
  font-size: 13px;
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  cursor:pointer;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold-light);
  transition: all .18s ease;
}
button.small:hover{ background: rgba(201,162,39,0.12); }
button.small.approve{ background: var(--green); border-color: var(--green); color: #fff; }
button.small.reject{ background: transparent; border-color: var(--red); color: var(--red); }
.empty{ color: var(--cream-dim); font-style: italic; padding: 20px 0; font-size: 14px; }

.field{ margin-bottom: 20px; max-width: 420px; }
.field label{ display:block; font-family:'Poppins', sans-serif; font-weight: 500; font-size: 13.5px; color: var(--gold-light); margin-bottom: 8px; }
input[type=text], input[type=email], input[type=password], select{
  width:100%;
  background: var(--navy-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--cream);
  font-family:'Poppins', sans-serif;
  font-size: 14.5px;
}
input:focus, select:focus{ outline:none; border-color: var(--gold); box-shadow: var(--shadow-glow); }

button.primary{
  font-family:'Poppins', sans-serif;
  font-weight: 600;
  font-size: 14.5px;
  padding: 13px 28px;
  border-radius: var(--radius-pill);
  cursor:pointer;
  border: 1px solid var(--gold);
  background: var(--gold);
  color: var(--navy);
  transition: all .18s ease;
}
button.primary:hover{ background: var(--gold-light); box-shadow: 0 8px 20px rgba(201,162,39,0.25); transform: translateY(-1px); }
button.primary:disabled{ opacity: .45; cursor:not-allowed; transform:none; box-shadow:none; }

.result-box{
  margin-top: 20px;
  padding: 20px 22px;
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-md);
  background: rgba(201,162,39,0.06);
  box-shadow: var(--shadow-card);
  max-width: 420px;
  display:none;
}
.result-box .line{ font-size: 14px; margin-bottom: 6px; }
.result-box .line strong{ color: var(--gold-light); }
.copy-btn{ margin-top: 10px; }

.status{ font-size: 13.5px; color: var(--cream-dim); margin-top: 12px; }
.status.error{ color: var(--red); }

.resp-group{ border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--navy-2); box-shadow: var(--shadow-card); margin-bottom: 14px; overflow: hidden; }
.resp-group-header{ display:flex; justify-content:space-between; align-items:center; gap: 12px; padding: 16px 20px; flex-wrap: wrap; border-bottom: 1px solid var(--line); cursor: pointer; }
.resp-toggle-icon{ color: var(--gold-light); font-size: 12px; transition: transform .18s ease; flex-shrink: 0; }
.resp-group.collapsed .resp-toggle-icon{ transform: rotate(-90deg); }
.resp-group.collapsed .resp-group-header{ border-bottom: none; }
.resp-group.collapsed .resp-items{ display:none; }
.resp-group-header .nome{ font-family:'Poppins', sans-serif; font-weight: 600; font-size: 15px; color: var(--cream); }
.resp-group-header .email{ font-size: 12.5px; color: var(--cream-dim); margin-top: 2px; }
.resp-count{ font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--navy); background: var(--gold); border-radius: var(--radius-pill); padding: 4px 12px; white-space: nowrap; }
.resp-items{ padding: 4px 20px; }
.resp-item{ padding: 14px 0; border-bottom: 1px solid var(--line); }
.resp-item:last-child{ border-bottom: none; }
.resp-item .texto{ font-family:'Poppins', sans-serif; font-style: italic; color: var(--cream); font-size: 14.5px; line-height: 1.5; word-wrap: break-word; }
.resp-item .quando{ font-size: 11.5px; color: var(--cream-dim); margin-top: 6px; }

/* Desktop grande (ex: 1920x1080) */
@media (min-width: 1440px){
  .app{ max-width: 1180px; }
}

/* Tablet */
@media (max-width: 1024px){
  .app{ padding: 32px 24px 70px; }
}

/* Mobile */
@media (max-width: 640px){
  .app{ padding: 28px 16px 60px; }
  .card .row{ align-items: flex-start; }
  .actions{ width: 100%; }
  .card .actions button{ flex: 1; }
}

.bell-wrap{ position: relative; }
.bell-btn{ position: relative; font-size: 16px; padding: 9px 14px; }
.bell-badge{
  position: absolute;
  top: -6px; right: -6px;
  background: var(--red);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  min-width: 17px;
  height: 17px;
  border-radius: var(--radius-pill);
  display:flex; align-items:center; justify-content:center;
  padding: 0 4px;
  font-family:'Poppins', sans-serif;
}
.notif-dropdown{
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 300px;
  max-height: 340px;
  overflow-y: auto;
  background: var(--navy-2);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  padding: 8px;
  z-index: 20;
}
.notif-item{ padding: 12px; border-radius: var(--radius-sm); font-size: 13px; color: var(--cream); line-height: 1.4; }
.notif-item:hover{ background: rgba(201,162,39,0.08); }
.notif-item .notif-date{ font-size: 11px; color: var(--cream-dim); }
.notif-empty{ padding: 16px; font-size: 13px; color: var(--cream-dim); font-style: italic; text-align:center; }

.hidden{ display:none !important; }

.alunos-toolbar{ display:flex; flex-wrap:wrap; gap: 10px; margin-bottom: 26px; }

.aluno-row-card{ padding: 16px 22px; }
.aluno-row-card .row{ flex-wrap: nowrap; }
.aluno-row-card .info{ min-width: 0; flex: 1; }
.aluno-row-card .nome, .aluno-row-card .email{ overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
.aluno-row-card .ver-aluno{ flex-shrink: 0; }

.check-field{ display:flex; align-items:center; gap: 10px; font-size: 13.5px; color: var(--cream-dim); cursor:pointer; margin-bottom: 14px; }
.check-field input[type=checkbox]{ width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--gold); }

.modal-overlay{
  position: fixed;
  inset: 0;
  background: rgba(8,14,28,0.72);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 20px;
  z-index: 200;
}
.modal-box{
  background: var(--navy-2);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 28px 26px;
  max-width: 440px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
}
.modal-header{ display:flex; justify-content:space-between; align-items:flex-start; gap: 12px; margin-bottom: 22px; }
.modal-header h3{ font-family:'Poppins', sans-serif; font-weight:700; font-size: 19px; margin:0; color: var(--cream); }
.modal-close{
  background:none; border:none; color: var(--cream-dim); font-size: 20px; line-height:1;
  cursor:pointer; padding: 2px 6px; font-family:'Poppins', sans-serif;
}
.modal-close:hover{ color: var(--gold-light); }
.modal-sub{ font-size: 12.5px; color: var(--cream-dim); margin: -12px 0 18px; }
.modal-box .field{ max-width: none; }

@media (max-width: 640px){
  .alunos-toolbar{ flex-direction: column; }
  .alunos-toolbar button{ width: 100%; }
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <img src="assets/logo.svg" alt="ÊNFASE" class="logo">
    <div class="actions">
      <div class="bell-wrap">
        <button class="link-btn bell-btn" onclick="toggleNotificacoes()">🔔<span class="bell-badge hidden" id="bellBadge">0</span></button>
        <div class="notif-dropdown hidden" id="notifDropdown"></div>
      </div>
      <a class="link-btn" href="inicio.html">◂ Voltar</a>
      <button class="link-btn" onclick="logout('index.html')">Sair</button>
    </div>
  </div>

  <div class="masthead">
    <h1>Painel da Professora</h1>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="alunos" onclick="switchTab('alunos')">Alunos</div>
    <div class="tab" data-tab="respostas" onclick="switchTab('respostas')">Respostas</div>
    <div class="tab" data-tab="pendentes" onclick="switchTab('pendentes')">Cadastros pendentes</div>
  </div>

  <!-- ALUNOS -->
  <div class="panel active" data-panel="alunos">
    <div class="alunos-toolbar">
      <button class="primary" style="margin-top:0; width:auto;" onclick="abrirModalCadastro()">+ Cadastrar aluno</button>
      <button class="small" onclick="copiarLinkArquetipo(event)">Copiar link do Arquétipo</button>
    </div>

    <div class="label" style="margin-bottom:14px;">Lista de alunos</div>
    <div id="alunosList"></div>

    <div class="label" style="margin-top:34px; margin-bottom:14px;">Administradores</div>
    <div id="adminsList"></div>
  </div>

  <!-- MODAL: CADASTRAR ALUNO -->
  <div class="modal-overlay hidden" id="modalCadastro">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Cadastrar aluno</h3>
        <button class="modal-close" onclick="fecharModalCadastro()">✕</button>
      </div>
      <div class="field">
        <label for="novoNome">Nome do aluno</label>
        <input type="text" id="novoNome" placeholder="Nome completo">
      </div>
      <div class="field">
        <label for="novoEmail">Email</label>
        <input type="email" id="novoEmail" placeholder="aluno@email.com">
      </div>
      <label class="check-field"><input type="checkbox" id="novoArquetipo"> Liberar Questionário Arquétipo</label>
      <label class="check-field"><input type="checkbox" id="novoCaderno" checked> Liberar Caderno Mentoria ÊNFASE</label>
      <div class="modal-sub">Uma senha provisória é gerada automaticamente. O aluno troca por uma senha própria no primeiro acesso.</div>
      <button class="primary" id="btnCriar" onclick="criarAluno()" style="width:100%;">Cadastrar aluno</button>
      <div class="status" id="criarStatus"></div>

      <div class="result-box" id="resultBox">
        <div class="line"><strong>Email:</strong> <span id="resEmail"></span></div>
        <div class="line"><strong>Senha provisória:</strong> <span id="resSenha"></span></div>
        <button class="small copy-btn" onclick="copiarCredenciais()">Copiar para enviar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: VER ALUNO -->
  <div class="modal-overlay hidden" id="modalAluno">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="verAlunoNome">Aluno</h3>
        <button class="modal-close" onclick="fecharModalAluno()">✕</button>
      </div>
      <div class="email" id="verAlunoEmail" style="margin-bottom:4px;"></div>
      <div class="when" id="verAlunoStatus" style="margin-bottom:22px;"></div>

      <label class="check-field"><input type="checkbox" id="verAlunoArquetipo"> Liberar Questionário Arquétipo</label>
      <label class="check-field"><input type="checkbox" id="verAlunoCaderno"> Liberar Caderno Mentoria ÊNFASE</label>

      <div class="actions" style="margin-top:22px;">
        <button class="small" id="btnResetarSenhaModal">Resetar senha</button>
        <button class="small reject" id="btnExcluirModal">Excluir aluno</button>
      </div>

      <div class="result-box" id="resetBox">
        <div class="line"><strong>Email:</strong> <span id="resetEmail"></span></div>
        <div class="line"><strong>Senha provisória:</strong> <span id="resetSenha"></span></div>
        <button class="small copy-btn" onclick="copiarCredenciaisReset()">Copiar para enviar</button>
      </div>
    </div>
  </div>

  <!-- RESPOSTAS -->
  <div class="panel" data-panel="respostas">
    <div class="field">
      <label for="aulaSelect">Aula</label>
      <select id="aulaSelect" onchange="onAulaSelectChange()">
        <option value="arquetipo:respostas">Arquétipo · Respostas</option>
        <option value="avatar:especialista">Pesquisa · Avatar e Especialista</option>
        <option value="roteiro:aula-0">Aula 0 · Minha Narrativa</option>
        <option value="identidade:aula-1">Aula 1 · Identidade</option>
        <option value="headlines:aula-2">Aula 2 · Caderno de Gatilhos</option>
        <option value="roteiro2:aula-2">Aula 2 · Estrutura de Roteiro</option>
        <option value="roteiro3:aula-3">Aula 3 · Gravação de Conteúdo</option>
        <option value="analise4:aula-4">Aula 4 · Parte 1, Crença Central e Gatilho</option>
        <option value="roteiro4:aula-4">Aula 4 · Headline e Roteiro</option>
      </select>
    </div>
    <div id="respostasList"></div>
  </div>

  <!-- PENDENTES -->
  <div class="panel" data-panel="pendentes">
    <div id="pendentesList"></div>
  </div>

</div>

<script src="js/supabase-client.js"></script>
<script>
let adminProfile = null;
let adminSession = null;

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
  if(name === 'respostas') onAulaSelectChange();
  if(name === 'alunos'){ carregarAlunos(); carregarAdmins(); }
}

function onAulaSelectChange(){
  const [tipo, aulaId] = document.getElementById('aulaSelect').value.split(':');
  if(tipo === 'roteiro') carregarRoteiros(aulaId);
  else if(tipo === 'roteiro2') carregarRoteirosAula2();
  else if(tipo === 'roteiro3') carregarRoteirosAula3();
  else if(tipo === 'roteiro4') carregarRoteiroFinalAula4();
  else if(tipo === 'analise4') carregarAnaliseHeadlineAula4();
  else if(tipo === 'avatar') carregarAvatarEspecialista();
  else if(tipo === 'arquetipo') carregarArquetipoRespostas();
  else if(tipo === 'identidade') carregarIdentidade();
  else carregarRespostas(aulaId);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso){
  return new Date(iso).toLocaleString('pt-BR');
}

function toggleRespGroup(header){
  header.closest('.resp-group').classList.toggle('collapsed');
}

// ---------------------------------------------------------------
// PENDENTES
// ---------------------------------------------------------------
async function carregarPendentes(){
  const el = document.getElementById('pendentesList');
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('status', 'pending')
    .order('created_at', { ascending: true });

  if(error){ el.innerHTML = `<div class="empty">Erro ao carregar: ${error.message}</div>`; return; }
  if(!data || data.length === 0){ el.innerHTML = '<div class="empty">Nenhum cadastro pendente.</div>'; return; }

  el.innerHTML = '';
  data.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="row">
        <div>
          <div class="nome">${escapeHtml(p.nome || '(sem nome)')}</div>
          <div class="email">${escapeHtml(p.email || '')}</div>
          <div class="when">Cadastrado em ${formatDate(p.created_at)}</div>
        </div>
        <div class="actions">
          <button class="small approve">Aprovar</button>
          <button class="small reject">Recusar</button>
        </div>
      </div>
      <div class="row" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line); gap:20px;">
        <label class="check-field" style="margin-bottom:0;"><input type="checkbox" class="pend-arquetipo"> Liberar Arquétipo</label>
        <label class="check-field" style="margin-bottom:0;"><input type="checkbox" class="pend-caderno" checked> Liberar Caderno</label>
      </div>
    `;
    card.querySelector('.approve').onclick = () => aprovarPendente(p.id, card);
    card.querySelector('.reject').onclick = () => recusarPendente(p.id);
    el.appendChild(card);
  });
}

async function aprovarPendente(id, card){
  const arquetipo = card.querySelector('.pend-arquetipo').checked;
  const caderno = card.querySelector('.pend-caderno').checked;
  const { error } = await supabaseClient
    .from('profiles')
    .update({ status: 'approved', arquetipo_habilitado: arquetipo, caderno_habilitado: caderno })
    .eq('id', id);
  if(error){ alert('Erro: ' + error.message); return; }
  carregarPendentes();
}

async function recusarPendente(id){
  const { error } = await supabaseClient.from('profiles').update({ status: 'rejected' }).eq('id', id);
  if(error){ alert('Erro: ' + error.message); return; }
  carregarPendentes();
}

// ---------------------------------------------------------------
// CADASTRAR ALUNO
// ---------------------------------------------------------------
function abrirModalCadastro(){
  document.getElementById('novoNome').value = '';
  document.getElementById('novoEmail').value = '';
  document.getElementById('novoArquetipo').checked = false;
  document.getElementById('novoCaderno').checked = true;
  document.getElementById('criarStatus').textContent = '';
  document.getElementById('criarStatus').className = 'status';
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('modalCadastro').classList.remove('hidden');
}

function fecharModalCadastro(){
  document.getElementById('modalCadastro').classList.add('hidden');
}

async function criarAluno(){
  const nome = document.getElementById('novoNome').value.trim();
  const email = document.getElementById('novoEmail').value.trim();
  const arquetipo = document.getElementById('novoArquetipo').checked;
  const caderno = document.getElementById('novoCaderno').checked;
  const status = document.getElementById('criarStatus');
  const btn = document.getElementById('btnCriar');
  document.getElementById('resultBox').style.display = 'none';

  if(!nome || !email){
    status.textContent = 'Preencha nome e email.';
    status.className = 'status error';
    return;
  }

  const senha = gerarSenhaProvisoria();
  btn.disabled = true;
  status.textContent = 'Cadastrando...';
  status.className = 'status';

  try{
    const res = await fetch('/.netlify/functions/create-student', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: adminSession.access_token, nome, email, senha, arquetipoHabilitado: arquetipo, cadernoHabilitado: caderno })
    });
    const result = await res.json();
    if(!res.ok){
      status.textContent = result.error || 'Não foi possível cadastrar.';
      status.className = 'status error';
      return;
    }
    status.textContent = 'Aluno cadastrado com sucesso.';
    status.className = 'status';

function gerarSenhaProvisoria(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let senha = '';
  for(let i = 0; i < 8; i++) senha += chars[Math.floor(Math.random() * chars.length)];
  return senha;
}

async function alternarArquetipoHabilitado(aluno, checkbox){
  checkbox.disabled = true;
  const payload = { arquetipo_habilitado: checkbox.checked };
  // marcar a caixa também aprova o cadastro, se ainda não tiver sido aprovado
  if(checkbox.checked && aluno.status !== 'approved') payload.status = 'approved';
  const { error } = await supabaseClient
    .from('profiles')
    .update(payload)
    .eq('id', aluno.id);
  checkbox.disabled = false;
  if(error){
    checkbox.checked = !checkbox.checked;
    alert('Erro: ' + error.message);
    return;
  }
  Object.assign(aluno, payload);
  atualizarStatusExibidoNoModal(aluno);
}

async function alternarCadernoHabilitado(aluno, checkbox){
  checkbox.disabled = true;
  const payload = { caderno_habilitado: checkbox.checked };

// ---------------------------------------------------------------
let alunoAtualModal = null;
const statusLabel = { approved: 'Aprovado', pending: 'Pendente', rejected: 'Recusado' };

function abrirModalAluno(p){
  alunoAtualModal = p;
  document.getElementById('verAlunoNome').textContent = p.nome || '(sem nome)';
  document.getElementById('verAlunoEmail').textContent = p.email || '';
  document.getElementById('verAlunoStatus').textContent = statusLabel[p.status] || p.status;
  document.getElementById('verAlunoArquetipo').checked = !!p.arquetipo_habilitado;
  document.getElementById('verAlunoCaderno').checked = !!p.caderno_habilitado;
  document.getElementById('resetBox').style.display = 'none';
  document.getElementById('modalAluno').classList.remove('hidden');
}

function fecharModalAluno(){
  document.getElementById('modalAluno').classList.add('hidden');
  alunoAtualModal = null;
}

document.getElementById('verAlunoArquetipo').addEventListener('change', (e) => {
  if(alunoAtualModal) alternarArquetipoHabilitado(alunoAtualModal, e.target);
});
document.getElementById('verAlunoCaderno').addEventListener('change', (e) => {
  if(alunoAtualModal) alternarCadernoHabilitado(alunoAtualModal, e.target);
});
document.getElementById('btnResetarSenhaModal').addEventListener('click', (e) => {
  if(alunoAtualModal) resetarSenhaAluno(alunoAtualModal, e.target);
});
document.getElementById('btnExcluirModal').addEventListener('click', async (e) => {
  if(!alunoAtualModal) return;
  const ok = await excluirAluno(alunoAtualModal, e.target);
  if(ok) fecharModalAluno();
});

async function resetarSenhaAluno(aluno, btn){
  if(!confirm(`Gerar uma nova senha provisória para ${aluno.nome || aluno.email}? A senha anterior deixa de funcionar.`)) return;
  const novaSenha = gerarSenhaProvisoria();
  btn.disabled = true;
  btn.textContent = 'Resetando...';
  try{
    const res = await fetch('/.netlify/functions/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: adminSession.access_token, userId: aluno.id, novaSenha })
    });
    const result = await res.json();
    if(!res.ok){
      alert(result.error || 'Não foi possível resetar a senha.');
      return;
    }
    document.getElementById('resetEmail').textContent = aluno.email || '';
    document.getElementById('resetSenha').textContent = novaSenha;
    document.getElementById('resetBox').style.display = 'block';
  } catch(e){
    alert('Erro de conexão. Tente novamente.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Resetar senha';
  }
}

function copiarCredenciaisReset(){
  const email = document.getElementById('resetEmail').textContent;
  const senha = document.getElementById('resetSenha').textContent;
  const texto = `Sua senha do Caderno de Atividades foi redefinida:\nLink: ${window.location.origin}\nEmail: ${email}\nSenha provisória: ${senha}\n\nVocê vai precisar trocar essa senha no próximo acesso.`;
  navigator.clipboard.writeText(texto);
}

async function excluirAluno(aluno, btn){
  if(!confirm(`Excluir ${aluno.nome || aluno.email} definitivamente? Isso apaga a conta e TODAS as respostas dele(a) (headlines, roteiros, narrativa). Não tem como desfazer.`)) return false;
  btn.disabled = true;
  btn.textContent = 'Excluindo...';
  try{
    const res = await fetch('/.netlify/functions/delete-student', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: adminSession.access_token, userId: aluno.id })
    });
    const result = await res.json();
    if(!res.ok){
      alert(result.error || 'Não foi possível excluir.');
      btn.disabled = false;
      btn.textContent = 'Excluir aluno';
      return false;
    }
    carregarAlunos();
    return true;
  } catch(e){
    alert('Erro de conexão. Tente novamente.');
    btn.disabled = false;
    btn.textContent = 'Excluir aluno';
    return false;
  }
}

async function carregarRespostas(aulaId){
  const el = document.getElementById('respostasList');
  el.innerHTML = '<div class="empty">Carregando...</div>';

  const { data: respostas, error } = await supabaseClient
    .from('respostas')
    .select('*')
    .eq('aula_id', aulaId)
    .order('created_at', { ascending: false });

  if(error){ el.innerHTML = `<div class="empty">Erro ao carregar: ${error.message}</div>`; return; }
  if(!respostas || respostas.length === 0){ el.innerHTML = '<div class="empty">Nenhuma resposta ainda para esta aula.</div>'; return; }

  const userIds = [...new Set(respostas.map(r => r.user_id))];
  const { data: perfis } = await supabaseClient.from('profiles').select('id,nome,email').in('id', userIds);
  const perfilMap = Object.fromEntries((perfis || []).map(p => [p.id, p]));

  // agrupa as respostas por aluno (respostas já vêm ordenadas da mais recente pra mais antiga)
  const groups = new Map();
  respostas.forEach(r => {
    if(!groups.has(r.user_id)) groups.set(r.user_id, []);
    groups.get(r.user_id).push(r);
  });

  // ordena os alunos pela resposta mais recente de cada um
  const orderedGroups = [...groups.entries()].sort((a, b) => new Date(b[1][0].created_at) - new Date(a[1][0].created_at));

  el.innerHTML = '';
  orderedGroups.forEach(([userId, items]) => {
    const perfil = perfilMap[userId] || {};
    const group = document.createElement('div');
    group.className = 'resp-group collapsed';
    group.innerHTML = `
      <div class="resp-group-header" onclick="toggleRespGroup(this)">
        <div>
          <div class="nome">${escapeHtml(perfil.nome || perfil.email || '(desconhecido)')}</div>
          ${perfil.nome ? `<div class="email">${escapeHtml(perfil.email || '')}</div>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="resp-count">${items.length} resposta${items.length > 1 ? 's' : ''}</div>
          <span class="resp-toggle-icon">▾</span>
        </div>
      </div>
      <div class="resp-items">
        ${items.map(r => `
          <div class="resp-item">
            <div class="texto">${escapeHtml(r.dados.texto || JSON.stringify(r.dados))}</div>
            <div class="quando">${formatDate(r.created_at)}</div>
          </div>
        `).join('')}
      </div>
    `;
    el.appendChild(group);
  });
}

function svgToPngDataUrl(url, width, height){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function gerarPdfAvatarEspecialista(registro){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 18;

  doc.setFillColor(15, 31, 61);
  doc.rect(0, 0, pageWidth, 36, 'F');

  try{
    const logoDataUrl = await svgToPngDataUrl('assets/logo.svg', 900, 260);
    const logoW = 64;
    const logoH = logoW * (260 / 900);
    doc.addImage(logoDataUrl, 'PNG', (pageWidth - logoW) / 2, (36 - logoH) / 2, logoW, logoH);
  } catch(e){
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('ÊNFASE', pageWidth / 2, 22, { align: 'center' });
  }

  let y = 50;
  const maxWidth = pageWidth - margin * 2;

  doc.setTextColor(15, 31, 61);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.text(`Aluno: ${registro.nome}`, margin, y);
  y += 7;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(60, 60, 60);
  doc.text(`Email: ${registro.email}`, margin, y);
  y += 6;
  const dataConclusao = new Date(registro.concluido_em || registro.created_at).toLocaleString('pt-BR');
  doc.text(`Concluído em: ${dataConclusao}`, margin, y);
  y += 12;

  PERGUNTAS_AVATAR.forEach(p => {
    const resposta = (registro.respostas && registro.respostas[p.id]) || '';
    if(y > pageHeight - 30){ doc.addPage(); y = 22; }

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.setTextColor(15, 31, 61);
    const tituloLines = doc.splitTextToSize(`${p.label}, ${p.pergunta}`, maxWidth);
    doc.text(tituloLines, margin, y);
    y += tituloLines.length * 5.5 + 2;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(40, 40, 40);
    const respLines = doc.splitTextToSize(resposta, maxWidth);
    respLines.forEach(line => {
      if(y > pageHeight - 20){ doc.addPage(); y = 22; }
      doc.text(line, margin, y);
      y += 5.5;
    });
    y += 7;
  });

  const nomeArquivo = (registro.nome || 'aluno').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  doc.save(`avatar-especialista-${nomeArquivo || 'aluno'}.pdf`);
}

async function gerarPdfIdentidade(registro, nomeAluno, emailAluno){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 18;
  const maxWidth = pageWidth - margin * 2;

  doc.setFillColor(15, 31, 61);
  doc.rect(0, 0, pageWidth, 36, 'F');

  try{
    const logoDataUrl = await svgToPngDataUrl('assets/logo.svg', 900, 260);

    doc.addImage(logoDataUrl, 'PNG', (pageWidth - logoW) / 2, (36 - logoH) / 2, logoW, logoH);
  } catch(e){
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('ÊNFASE', pageWidth / 2, 22, { align: 'center' });

  let y = 50;

  doc.setTextColor(15, 31, 61);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.text(`Aluno: ${nomeAluno || ''}`, margin, y);
  y += 7;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(60, 60, 60);
  if(emailAluno){
    doc.text(`Email: ${emailAluno}`, margin, y);
    y += 6;
  }
  const dataConclusao = new Date(registro.concluido_em || registro.created_at).toLocaleString('pt-BR');
  doc.text(`Concluído em: ${dataConclusao}`, margin, y);
  y += 12;

  function checarQuebra(alturaNecessaria){
    if(y > pageHeight - alturaNecessaria){ doc.addPage(); y = 22; }
  }

  function escreverBloco(titulo, linhas){
    checarQuebra(24);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.setTextColor(201, 162, 39);
    doc.text(titulo, margin, y);
    y += 8;

    linhas.forEach(([label, valor]) => {
      checarQuebra(20);
      if(label){
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(15, 31, 61);
        const labelLines = doc.splitTextToSize(label, maxWidth);
        doc.text(labelLines, margin, y);
        y += labelLines.length * 5.2 + 1;
      }
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(11);
      doc.setTextColor(40, 40, 40);
      const valorLines = doc.splitTextToSize(String(valor || ''), maxWidth);
      valorLines.forEach(line => {
        checarQuebra(14);
        doc.text(line, margin, y);
        y += 5.2;
      });
      y += 5;
    });
    y += 3;
  }

  const r = registro.respostas || {};

  escreverBloco('ESPAÇO 1, AS TRÊS CAMADAS', [
    ['Hoje, minha comunicação é dominada por:', r.camada_dominante],

    ...EIXOS_IDENTIDADE.map(eixo => [`${eixo.label} (nota ${r['diag_' + eixo.id + '_nota'] || '-'}):`, r['diag_' + eixo.id + '_exemplo']]),

  "Conte uma situação em que você agiu de um jeito que te surpreendeu, para o bem ou para o mal. O que aconteceu e o que você fez?",
  "Qual foi a decisão mais difícil que você já tomou na sua vida profissional? Por que ela foi difícil?",
  "Descreva um momento em que você pensou: é para isso que eu nasci. Onde você estava, o que estava fazendo e o que sentiu?",
  "Qual crítica ou apelido as pessoas mais próximas já te deram, mesmo de brincadeira, que você sente que tem um fundo de verdade?",
  "O que te tira do sério no seu mercado? O que você vê os outros fazendo que você se recusa a fazer?",
  "Se seu trabalho fosse um personagem de filme, série ou livro, qual seria e por quê?",
  "O que você mais teme que digam sobre você pelas suas costas?",
  "Se você pudesse ser lembrado por uma única coisa daqui a vinte anos, o que seria?",
];

async function carregarArquetipoRespostas(){
  const el = document.getElementById('respostasList');
  el.innerHTML = '<div class="empty">Carregando...</div>';

  const { data, error } = await supabaseClient
    .from('arquetipo')
    .select('*')
    .eq('concluido', true)
    .order('concluido_em', { ascending: false });

  if(error){ el.innerHTML = `<div class="empty">Erro ao carregar: ${error.message}</div>`; return; }
  if(!data || data.length === 0){ el.innerHTML = '<div class="empty">Nenhum aluno concluiu o questionário ainda.</div>'; return; }

  el.innerHTML = '';
  data.forEach(registro => {
    const nomeCompleto = `${registro.contato?.primeiro_nome || ''} ${registro.contato?.sobrenome || ''}`.trim();
    const card = document.createElement('div');
    card.className = 'resp-group collapsed';
    card.innerHTML = `
      <div class="resp-group-header" onclick="toggleRespGroup(this)">
        <div>
          <div class="nome">${escapeHtml(nomeCompleto || registro.contato?.email || '(desconhecido)')}</div>
          <div class="email">${escapeHtml(registro.contato?.email || '')}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="resp-count">${new Date(registro.concluido_em).toLocaleDateString('pt-BR')}</div>
          <span class="resp-toggle-icon">▾</span>
        </div>
      </div>
      <div class="resp-items">
        <div class="resp-item">
          <button class="small baixar-pdf-arquetipo">Baixar PDF</button>
        </div>
      </div>
    `;
    card.querySelector('.baixar-pdf-arquetipo').onclick = async (e) => {
      const btn = e.target;
      btn.disabled = true;
      btn.textContent = 'Gerando...';
      try{
        await gerarPdfArquetipo(registro, nomeCompleto);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Baixar PDF';
      }
    };
    el.appendChild(card);
  });
}

async function gerarPdfArquetipo(registro, nomeCompleto){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 18;
  const maxWidth = pageWidth - margin * 2;

  function novaCapa(){
    doc.setFillColor(15, 31, 61);
    doc.rect(0, 0, pageWidth, 36, 'F');
  }
  novaCapa();

  try{
    const logoDataUrl = await svgToPngDataUrl('assets/logo.svg', 900, 260);
    const logoW = 64;
    const logoH = logoW * (260 / 900);
    doc.addImage(logoDataUrl, 'PNG', (pageWidth - logoW) / 2, (36 - logoH) / 2, logoW, logoH);
  } catch(e){
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('ÊNFASE', pageWidth / 2, 22, { align: 'center' });
  }

  let y = 50;

  doc.setTextColor(15, 31, 61);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.text(`Aluno: ${nomeCompleto || registro.contato?.email || ''}`, margin, y);
  y += 8;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(60, 60, 60);
  CONTATO_FIXOS_ARQ.forEach(c => {
    const val = (registro.contato && registro.contato[c.id]) || '';
    doc.text(`${c.label}: ${val}`, margin, y);
    y += 5.5;
  });
  y += 2;
  doc.text(`Concluído em: ${new Date(registro.concluido_em).toLocaleString('pt-BR')}`, margin, y);
  y += 12;

  function checarQuebra(alturaNecessaria){
    if(y > pageHeight - alturaNecessaria){ doc.addPage(); y = 22; }
  }

  function escreverPergunta(titulo, resposta){
    checarQuebra(24);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11.5);
    doc.setTextColor(15, 31, 61);
    const tituloLines = doc.splitTextToSize(titulo, maxWidth);
    doc.text(tituloLines, margin, y);
    y += tituloLines.length * 5.2 + 1.5;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(40, 40, 40);
    const respLines = doc.splitTextToSize(String(resposta || ''), maxWidth);
    respLines.forEach(line => {
      checarQuebra(14);
      doc.text(line, margin, y);
      y += 5.2;
    });
    y += 5;
  }

  checarQuebra(20);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(201, 162, 39);
  doc.text('BLOCO 1', margin, y);
  y += 7;
  GRUPO_A_ARQ.forEach((pergunta, i) => escreverPergunta(pergunta, registro.respostas?.[`a_${i+1}`] || ''));

  checarQuebra(20);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(201, 162, 39);
  doc.text('BLOCO 2', margin, y);
  y += 7;
  GRUPO_B_ARQ.forEach((pergunta, i) => escreverPergunta(pergunta, registro.respostas?.[`b_${i+1}`] || ''));

  checarQuebra(20);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(201, 162, 39);
  doc.text('BLOCO 3', margin, y);
  y += 7;
  GRUPO_C_ARQ.forEach((pergunta, i) => escreverPergunta(pergunta, registro.respostas?.[`c_${i+1}`] || ''));

  checarQuebra(20);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(201, 162, 39);
  doc.text('BLOCO 4', margin, y);
  y += 7;
  GRUPO_D_ARQ.forEach((pergunta, i) => escreverPergunta(pergunta, registro.respostas?.[`d_${i+1}`] || ''));

  const nomeArquivo = (nomeCompleto || 'aluno').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  doc.save(`arquetipo-${nomeArquivo || 'aluno'}.pdf`);
}

(async function init(){
  const { session, profile } = await getSessionAndProfile();
  if(!session || !profile || profile.status !== 'approved'){
    window.location.href = 'index.html';
    return;
  }
  if(profile.role !== 'admin'){
    window.location.href = 'inicio.html';
    return;
  }
  adminSession = session;
  adminProfile = profile;
  carregarAlunos();
  carregarAdmins();
  verificarNotificacoes();
})();

// NOTIFICAÇÕES (sininho)
// ---------------------------------------------------------------
let notificacoesPendentes = [];

async function verificarNotificacoes(){
  const { data, error } = await supabaseClient
    .from('arquetipo')
    .select('user_id, concluido_em, contato')
    .eq('concluido', true)
    .eq('visto_pelo_professor', false)
    .order('concluido_em', { ascending: false });
  if(error || !data) return;
  notificacoesPendentes = data;
  const badge = document.getElementById('bellBadge');
  if(data.length > 0){
    badge.textContent = data.length;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function renderNotificacoes(){
  const dropdown = document.getElementById('notifDropdown');
  if(notificacoesPendentes.length === 0){
    dropdown.innerHTML = '<div class="notif-empty">Nenhuma notificação nova.</div>';
    return;
  }
  dropdown.innerHTML = notificacoesPendentes.map(n => {
    const nome = `${n.contato?.primeiro_nome || ''} ${n.contato?.sobrenome || ''}`.trim() || n.contato?.email || 'Aluno';
    const data = new Date(n.concluido_em).toLocaleString('pt-BR');
    return `<div class="notif-item"><strong>${escapeHtml(nome)}</strong> concluiu o Questionário Arquétipo<br><span class="notif-date">${data}</span></div>`;
  }).join('');
}

async function marcarNotificacoesComoVistas(){
  if(notificacoesPendentes.length === 0) return;
  const ids = notificacoesPendentes.map(n => n.user_id);
  await supabaseClient.from('arquetipo').update({ visto_pelo_professor: true }).in('user_id', ids);
  document.getElementById('bellBadge').classList.add('hidden');
}

function toggleNotificacoes(){
  const dropdown = document.getElementById('notifDropdown');
  const estavaEscondido = dropdown.classList.contains('hidden');
  if(estavaEscondido){
    renderNotificacoes();
    dropdown.classList.remove('hidden');
    marcarNotificacoesComoVistas();
  } else {
    dropdown.classList.add('hidden');
  }
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.bell-wrap');
  if(wrap && !wrap.contains(e.target)){
    document.getElementById('notifDropdown').classList.add('hidden');
  }
});
</script>
